[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-sql-engine"
version = "0.1.0"
description = "A small SQL engine: lexer, parser, planner with index selection and hash joins, and an iterator executor, tested against SQLite"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["minisql"]
